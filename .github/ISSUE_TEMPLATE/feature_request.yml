name: 功能建议
description: 想要的新功能、改进、体验问题，用这个
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚：这是一个个人项目，**方向由作者定**，写得再好的建议也可能不做。
        但"你在什么场景下被卡住了"永远比"你应该加个 XXX 按钮"有用。

        如果是**现有功能坏掉了**，请改开 Bug 报告。

  - type: input
    id: version
    attributes:
      label: 你当前用的版本（带后缀）
      placeholder: 0.1.6-SNAPSHOT-fix12
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新功能
        - 现有功能改进
        - 界面 / 交互体验
        - 性能 / 体积 / 内存
        - 文档 / 文案
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 场景
      description: 先讲场景，再讲方案。什么样的情况下你觉得"这里应该能 XXX"？
      placeholder: |
        我有三个 dsh 实例，每次切换都要点进详情页再返回……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的改法
      description: 一句话也行，界面草图更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现有功能能不能凑合解决？如果能，说明为什么不够
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: 你愿意自己来写吗
      description: 愿意的话请先看 CONTRIBUTING.md，并在 Issue 里说一声，避免和白写冲突
      options:
        - 愿意提 PR（已读过 CONTRIBUTING.md）
        - 愿意试，但需要指路
        - 只想提建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 参考实现、同类项目怎么做的、截图
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue（含已关闭的），没有重复
          required: true
        - label: 我理解这是个人项目，不承诺采纳或响应时效
          required: true
